[project]
name = "strata-gateway"
version = "0.1.0"
description = "API Gateway for Strata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strata-core",
    "strata-protocols",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_gateway"]

[tool.uv.sources]
strata-core = { workspace = true }
strata-protocols = { workspace = true }

