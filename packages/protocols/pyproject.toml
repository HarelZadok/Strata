[project]
name = "strata-protocols"
version = "0.1.0"
description = "gRPC Protobuf definitions for Strata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_protocols"]

