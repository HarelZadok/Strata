syntax = "proto3";

package strata.agent;

service AgentService {
  rpc SubmitTask (TaskRequest) returns (stream TaskEvent);
  rpc SendScreenshot (ScreenshotData) returns (GroundingResult);
  rpc ExecuteToolCall (ToolCallRequest) returns (ToolCallResult);
}

message TaskRequest {
  string session_id = 1;
  string task = 2;
}

message TaskEvent {
  string type = 1; // e.g. "agent_token", "agent_action", "task_complete"
  string content = 2; // For tokens or summaries
  string tool = 3; // For agent_action
  string args_json = 4; // JSON string for args
}

message ScreenshotData {
  bytes image_data = 1;
}

message GroundingResult {
  message Element {
    int32 id = 1;
    string type = 2;
    string text = 3;
    float x = 4;
    float y = 5;
    float width = 6;
    float height = 7;
  }
  repeated Element elements = 1;
  bytes annotated_image = 2;
}

message ToolCallRequest {
  string tool_name = 1;
  string args_json = 2;
}

message ToolCallResult {
  bool success = 1;
  string result_json = 2;
  string error_message = 3;
}
