[project]
name = "strata-os"
version = "0.1.0"
description = "Windows OS automation primitives for Strata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bettercam",
    "mss",
    "pywinauto",
    "winsdk",
    "pywin32",
    "numpy",
    "opencv-python",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
